version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    # bincode 3.0.0 contains only compile_error!; retain the wire-compatible v1.
    ignore:
      - dependency-name: bincode
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /izanagi-agent
    ignore:
      - dependency-name: bincode
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /izanagi-dns-proxy
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /izanagi-http-capture
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
