name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.93.1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: landlock,ebpf
          - os: macos-latest
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        shell: bash
        run: |
          if [[ -n "${{ matrix.features }}" ]]; then
            cargo test --locked --all-targets --features "${{ matrix.features }}"
          else
            cargo test --locked --all-targets
          fi

  component-tests:
    name: Test component (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - izanagi-common/Cargo.toml
          - izanagi-agent/Cargo.toml
          - izanagi-dns-proxy/Cargo.toml
          - izanagi-http-capture/Cargo.toml
          - izanagi-telemetry/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test component
        shell: bash
        run: |
          if [[ "${{ matrix.manifest }}" == "izanagi-common/Cargo.toml" ]]; then
            cargo check --manifest-path "${{ matrix.manifest }}" --no-default-features
            cargo test --all-targets --manifest-path "${{ matrix.manifest }}" --features user
          else
            cargo test --locked --all-targets --manifest-path "${{ matrix.manifest }}"
          fi

  agent-ebpf:
    name: Check agent eBPF feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --manifest-path izanagi-agent/Cargo.toml --features ebpf

  ebpf-build:
    name: Build no_std eBPF program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install bpf-linker --locked
      - run: cargo build --manifest-path izanagi-ebpf/Cargo.toml --target bpfel-unknown-none -Z build-std=core

  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --all -- --check
          for manifest in izanagi-common/Cargo.toml izanagi-agent/Cargo.toml izanagi-dns-proxy/Cargo.toml izanagi-http-capture/Cargo.toml izanagi-telemetry/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
          done
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
