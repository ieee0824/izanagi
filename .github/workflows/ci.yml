name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.93.1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: landlock,ebpf
          - os: macos-latest
            features: ""
    runs-on: ${{ matrix.os }}
    env:
      IZANAGI_REQUIRE_LANDLOCK_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test
        shell: bash
        run: |
          if [[ -n "${{ matrix.features }}" ]]; then
            cargo test --locked --all-targets --features "${{ matrix.features }}"
          else
            cargo test --locked --all-targets
          fi

  component-tests:
    name: Test component (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - izanagi-common/Cargo.toml
          - izanagi-agent/Cargo.toml
          - izanagi-dns-proxy/Cargo.toml
          - izanagi-http-capture/Cargo.toml
          - izanagi-telemetry/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test component
        shell: bash
        run: |
          if [[ "${{ matrix.manifest }}" == "izanagi-common/Cargo.toml" ]]; then
            cargo check --manifest-path "${{ matrix.manifest }}" --no-default-features
            cargo test --all-targets --manifest-path "${{ matrix.manifest }}" --features user
          else
            cargo test --locked --all-targets --manifest-path "${{ matrix.manifest }}"
          fi
      - name: Test privileged agent credentials on Linux
        if: matrix.manifest == 'izanagi-agent/Cargo.toml'
        shell: bash
        run: |
          agent_test=$(cargo test --locked --manifest-path izanagi-agent/Cargo.toml --no-run --message-format=json | python3 -c 'import sys,json; artifacts=[json.loads(line) for line in sys.stdin if line.startswith("{")]; print(next(a["executable"] for a in artifacts if a.get("reason")=="compiler-artifact" and a.get("profile",{}).get("test") and a.get("executable") and a.get("target",{}).get("name")=="izanagi-agent"))')
          sudo useradd --no-create-home --home-dir /home/izanagi --shell /bin/bash izanagi
          sudo install -d -m 0755 /workspace
          credential_fixture=$(mktemp -d /tmp/izanagi-credentials.XXXXXX)
          trap 'rm -rf -- "$credential_fixture"' EXIT
          chmod 0755 "$credential_fixture"
          sudo install -m 0755 "$agent_test" "$credential_fixture/agent-test"
          sudo "$credential_fixture/agent-test" privilege_tests::privileged_ --ignored --nocapture --test-threads=1
      - name: Test container session authentication and execution
        if: matrix.manifest == 'izanagi-agent/Cargo.toml'
        shell: bash
        run: |
          cargo build --locked --manifest-path izanagi-agent/Cargo.toml
          container_fixture=$(mktemp -d /tmp/izanagi-session.XXXXXX)
          trap 'docker image rm -f izanagi-session-test; rm -rf -- "$container_fixture"' EXIT
          cp izanagi-agent/target/debug/izanagi-agent "$container_fixture/izanagi-agent"
          cp tests/fixtures/container-agent/Dockerfile "$container_fixture/Dockerfile"
          docker build -t izanagi-session-test "$container_fixture"
          printf '%s' 'fixture-host-key-not-for-container' > "$container_fixture/host-key"
          chmod 0600 "$container_fixture/host-key"
          IZANAGI_SECRET_FILE="$container_fixture/host-key" IZANAGI_TEST_CONTAINER_RUNTIME=docker IZANAGI_TEST_CONTAINER_IMAGE=izanagi-session-test \
            cargo test --locked --lib real_container_session_credentials_and_agent_execution -- --ignored --nocapture

  agent-ebpf:
    name: Check agent eBPF feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --manifest-path izanagi-agent/Cargo.toml --features ebpf

  ebpf-build:
    name: Build no_std eBPF program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install bpf-linker
        shell: bash
        run: |
          archive="$RUNNER_TEMP/bpf-linker.tar.zst"
          curl --fail --location --retry 3 --output "$archive" https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "e058a6aecc9e65fa4c977b298a8e4b738424d7629769fd352eed409fb57e16e8  $archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$HOME/.cargo/bin"
      - run: cargo build --manifest-path izanagi-ebpf/Cargo.toml --release --target bpfel-unknown-none -Z build-std=core

  image-security:
    name: Image security (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:13-slim, alpine:3.23]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify finalization and unsafe-state regressions
        run: |
          docker run --rm -v "$PWD:/checks:ro" "${{ matrix.image }}" sh -eu -c '
            if command -v apt-get >/dev/null; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server procps systemd
            else
              apk add --no-cache openssh openrc procps shadow
            fi
            sh /checks/tests/image-security.sh /checks/packer
          '

  image-build-definition:
    name: Validate image build definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate build script and referenced Dockerfiles
        run: |
          bash -n image/build.sh
          bash tests/image-build-tags.sh
          test -f image/Dockerfile.build
          image/build.sh --help

  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --all -- --check
          for manifest in izanagi-common/Cargo.toml izanagi-agent/Cargo.toml izanagi-dns-proxy/Cargo.toml izanagi-http-capture/Cargo.toml izanagi-telemetry/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
          done
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
