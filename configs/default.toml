# Example settings. Behavior analysis and remote classification are disabled.
# Copy the required sections into the project settings generated by `izanagi init`.
[sandbox]
backend = "native"
tracer = "auto"
require_auth = true

[share]
paths = ["."]
mount_point = "/workspace"

[monitor]
syscalls = ["file", "network", "process", "env"]

[detect]
suspicious_paths = ["~/.ssh/*", "~/.aws/*", "~/.gnupg/*", "~/.config/gh/*"]
allowed_hosts = []

# Live PoC requires sandbox.backend="qemu" and tracer="vm-agent", plus an
# updated Linux guest agent/eBPF object and root-owned HTTP sidecar binary at
# /usr/local/bin/izanagi-http-capture. Missing prerequisites fail before trace readiness.
[behavior]
enabled = false
proxy_listen = "127.0.0.1:18080"
# Trusted novelty baseline. Policy allowed_hosts remains a separate setting.
baseline_hosts = []
# fixture_endpoint is only for an isolated test receiver; do not set it for normal work.

[behavior.classifier]
provider = "mock"                # mock | jev-mcp (mock does not call an API)
command = "jev-mcp"              # For jev-mcp, replace with a trusted absolute executable path.
args = []
credential_env = "TYPESAFE_API_KEY" # Name only. Never place an API key in TOML or args.
model = "jev-1.13.0"
# mcp_commit = "40-hex-git-revision" # Operator-declared; omit when unverified.
profile = "reliable"
deadline_secs = 65
min_confidence = 0.6             # Tune on development; freeze before held-out evaluation.
allow_export = false            # jev-mcp sends allowed feature fields to TypeSafe API.

[behavior.limits]
queue_windows = 32
telemetry_queue = 4096
max_queue_age_secs = 15
max_result_age_secs = 90
shutdown_secs = 2
max_store_bytes = 104857600
retention_days = 7
