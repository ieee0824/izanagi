# Debian Preseed Configuration for izanagi
# Automated installation for QEMU/Packer

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string izanagi
d-i netcfg/get_domain string local

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Partitioning (single partition + EFI)
d-i partman-auto/method string regular
d-i partman-efi/non_efi_system boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Root account (crypted password: "izanagi")
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$Z/FZKoDMPh9c55uF$.YnW8qOZUwUO8l7.d0QHUjH28BhnF56WsudnAedgtIA5wrtzTgHXr0XcRYL5kZWeWmlt4PetN.a3RehGBAsNm1
d-i passwd/make-user boolean false

# Package selection
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server curl systemd-resolved
d-i pkgsel/remove string nftables
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# GRUB bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Post-installation: SSH root login 許可 + 9p モジュール追加 + systemd-networkd
# systemd-networkd を使い、インターフェース名ではなくデバイス種別 (ether) で
# マッチすることで、PCI トポロジ変更によるインターフェース名変化に対応する。
# izanagi 実行時は virtio-9p-pci が追加されるため、Packer ビルド時とは
# PCI スロット配置が異なり、ifupdown では NIC 名不一致でネットワークが起動しない。
d-i preseed/late_command string \
  in-target sed -i 's/^[#[:space:]]*PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config; \
  echo '9p' >> /target/etc/modules; \
  echo '9pnet' >> /target/etc/modules; \
  echo '9pnet_virtio' >> /target/etc/modules; \
  echo 'qemu_fw_cfg' >> /target/etc/modules; \
  mkdir -p /target/workspace; \
  echo 'workspace /workspace 9p trans=virtio,version=9p2000.L,nofail 0 0' >> /target/etc/fstab; \
  mkdir -p /target/etc/systemd/network; \
  printf '[Match]\nType=ether\n\n[Network]\nDHCP=yes\n' > /target/etc/systemd/network/10-ether.network; \
  in-target systemctl enable systemd-networkd; \
  in-target systemctl enable systemd-resolved; \
  in-target systemctl disable networking; \
  rm -f /target/etc/resolv.conf; \
  ln -s /run/systemd/resolve/stub-resolv.conf /target/etc/resolv.conf; \
  sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=0/' /target/etc/default/grub; \
  in-target update-grub

# Finish
d-i finish-install/reboot_in_progress note
