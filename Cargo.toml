[package]
name = "izanagi"
version = "0.1.0"
edition = "2024"

[features]
default = []
ebpf = ["dep:aya", "dep:bytes", "dep:izanagi-common"]
landlock = ["dep:landlock"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "3"
dialoguer = "0.11"
async-trait = "0.1"
bincode = "3"
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "io-std", "time", "net", "signal"] }
glob = "0.3"
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
regex = "1"
smallvec = { version = "1", features = ["serde"] }
toml = "0.8"
rand = "0.9"
hex = "0.4"
serde_json = "1"
zeroize = "1"

# eBPF (Linux only, feature-gated)
aya = { version = "0.13", optional = true }
bytes = { version = "1", optional = true }
izanagi-common = { path = "izanagi-common", features = ["user"], optional = true }
# Landlock (Linux only, feature-gated)
landlock = { version = "0.4", optional = true }

[dev-dependencies]
serial_test = "3"
